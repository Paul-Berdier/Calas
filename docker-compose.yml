name: calas-development
services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: calas_development
      POSTGRES_USER: calas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm local:prepare first}
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U calas -d calas_development']
      interval: 3s
      timeout: 3s
      retries: 20
  storage:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Run pnpm local:prepare first}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Run pnpm local:prepare first}
    ports:
      - '127.0.0.1:19000:9000'
      - '127.0.0.1:19001:9001'
    volumes:
      - media_data:/data
  mail:
    image: axllent/mailpit@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - '127.0.0.1:11025:1025'
      - '127.0.0.1:18025:8025'
volumes:
  postgres_data:
  media_data:
